<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-glyph.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The tagline stays in the H1; the browser title carries the words
         people actually search for. Keep it under ~60 characters. -->
    <title>SeatSnags · NYC event tickets at the price you set</title>
    <meta name="description" content="Set the most you'd pay for concert, sports and theater tickets in New York, fees included. SeatSnags watches the resale market and buys the moment the price fits. No snag, no charge." />

    <!-- seatsnags.com 308-redirects to www, so www is the one address every
         tag below must agree on; a non-www og:image goes through that redirect
         and some preview bots (LinkedIn, iMessage) won't follow it. -->
    <link rel="canonical" href="https://www.seatsnags.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SeatSnags" />
    <meta property="og:url" content="https://www.seatsnags.com/" />
    <meta property="og:title" content="SeatSnags · Stop refreshing. Start snagging." />
    <meta property="og:description" content="You set the price. We'll find the tickets. Set the most you'd pay for events in New York and SeatSnags buys the moment tickets fit your max. No snag, no charge." />
    <meta property="og:image" content="https://www.seatsnags.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SeatSnags: you set the price, we find the tickets." />

    <!-- Twitter / X reads name=, not property= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SeatSnags · Stop refreshing. Start snagging." />
    <meta name="twitter:description" content="You set the price. We'll find the tickets. Set the most you'd pay for events in New York and SeatSnags buys the moment tickets fit your max. No snag, no charge." />
    <meta name="twitter:image" content="https://www.seatsnags.com/og-image.png" />

    <!-- Fonts. As <link>s here rather than @import in index.css so the browser
         can start fetching them alongside the stylesheet instead of after it;
         the preconnects open the two Google origins during the HTML parse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" />

    <!-- Organization: ties the brand name to this site and its social
         profiles. The FAQPage block is rendered by the FAQ section itself. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SeatSnags",
      "legalName": "SeatSnags Inc.",
      "url": "https://www.seatsnags.com/",
      "logo": "https://www.seatsnags.com/apple-touch-icon.png",
      "email": "support@seatsnags.com",
      "address": { "@type": "PostalAddress", "addressLocality": "New York", "addressRegion": "NY", "addressCountry": "US" },
      "sameAs": [
        "https://www.instagram.com/seatsnags/",
        "https://www.linkedin.com/company/seatsnags/",
        "https://www.facebook.com/profile.php?id=61590691582009"
      ]
    }
    </script>

    <!-- Crisp chat widget -->
    <script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="28b7bff8-ce02-4825-bdf9-15de416a95ca";(function(){d=document;s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
